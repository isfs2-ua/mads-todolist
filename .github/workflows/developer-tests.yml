
name: Developer Tests

on: push

jobs:
  launch-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Check Java version
        run: java -version

      - name: Launch tests with Maven
        run: ./mvnw -B test
