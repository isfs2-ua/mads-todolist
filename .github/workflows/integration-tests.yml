
name: Integration tests

on: push

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: mads
          POSTGRES_PASSWORD: mads
          POSTGRES_DB: mads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mads -d mads_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Launch integration tests with Maven
        run: ./mvnw -B test -Dspring.profiles.active=postgres
        env:
          POSTGRES_HOST: localhost
