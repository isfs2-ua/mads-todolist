<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Equipos')"></head>

<body>
<nav th:replace="fragments :: menuUsuario(${usuario})"></nav>
<div class="container-fluid">
    <div class="row mt-3">
        <div class="col">
            <h2>Listado de equipos</h2>
            <div class="alert alert-success" role="status" th:if="${mensaje}" th:text="${mensaje}"></div>
            <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
            <a class="btn btn-primary mb-3" th:href="@{/equipos/nuevo}">Nuevo equipo</a>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th scope="col">Identificador</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Participación</th>
                    <th scope="col" th:if="${usuario.administrador}">Gestión</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="equipo : ${equipos}">
                    <td th:text="${equipo.id}"></td>
                    <td>
                        <a th:href="@{/equipos/{id}/miembros(id=${equipo.id})}" th:text="${equipo.nombre}"></a>
                    </td>
                    <td>
                        <form method="post" th:unless="${#lists.contains(equiposUsuario, equipo)}"
                              th:action="@{/equipos/{id}/unirse(id=${equipo.id})}">
                            <button class="btn btn-primary btn-sm" type="submit">Unirme</button>
                        </form>
                        <form method="post" th:if="${#lists.contains(equiposUsuario, equipo)}"
                              th:action="@{/equipos/{id}/salir(id=${equipo.id})}">
                            <button class="btn btn-outline-danger btn-sm" type="submit">Salir</button>
                        </form>
                    </td>
                    <td th:if="${usuario.administrador}">
                        <a class="btn btn-secondary btn-sm" th:href="@{/equipos/{id}/editar(id=${equipo.id})}">Editar equipo</a>
                        <a class="btn btn-danger btn-sm" th:href="@{/equipos/{id}/eliminar(id=${equipo.id})}">Eliminar equipo</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${#lists.isEmpty(equipos)}">No hay equipos registrados.</p>
        </div>
    </div>
</div>
<div th:replace="fragments :: javascript"></div>
</body>
</html>
