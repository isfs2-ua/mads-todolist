<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Equipos')"></head>

<body>
<nav th:replace="fragments :: menuUsuario(${usuario})"></nav>
<div class="container-fluid">
    <div class="row mt-3">
        <div class="col">
            <h2>Listado de equipos</h2>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th scope="col">Identificador</th>
                    <th scope="col">Nombre</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="equipo : ${equipos}">
                    <td th:text="${equipo.id}"></td>
                    <td>
                        <a th:href="@{/equipos/{id}/miembros(id=${equipo.id})}" th:text="${equipo.nombre}"></a>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${#lists.isEmpty(equipos)}">No hay equipos registrados.</p>
        </div>
    </div>
</div>
<div th:replace="fragments :: javascript"></div>
</body>
</html>
