<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Descripción de usuario')"></head>

<body>
<div class="container-fluid">
    <div class="row mt-3">
        <div class="col">
            <h2>Descripción de usuario</h2>
            <dl>
                <dt>Identificador</dt>
                <dd th:text="${usuarioDescripcion.id}"></dd>
                <dt>Correo electrónico</dt>
                <dd th:text="${usuarioDescripcion.email}"></dd>
                <dt>Nombre</dt>
                <dd th:text="${#strings.isEmpty(usuarioDescripcion.nombre) ? 'Sin especificar' : usuarioDescripcion.nombre}"></dd>
                <dt>Fecha de nacimiento</dt>
                <dd th:text="${usuarioDescripcion.fechaNacimiento != null ? #dates.format(usuarioDescripcion.fechaNacimiento, 'dd/MM/yyyy') : 'Sin especificar'}"></dd>
            </dl>
        </div>
    </div>
</div>
</body>
</html>
