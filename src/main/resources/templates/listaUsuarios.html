<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Usuarios registrados')"></head>

<body>
<nav th:replace="${usuario != null} ? ~{fragments :: menuUsuario(${usuario})} : ~{fragments :: menuVisitante}"></nav>
<div class="container-fluid">
    <div class="row mt-3">
        <div class="col">
            <h2>Listado de usuarios registrados</h2>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th scope="col">Identificador</th>
                    <th scope="col">Correo electrónico</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}"></td>
                    <td th:text="${usuario.email}"></td>
                </tr>
                </tbody>
            </table>
            <p th:if="${#lists.isEmpty(usuarios)}">No hay usuarios registrados.</p>
        </div>
    </div>
</div>
<div th:replace="fragments :: javascript"></div>
</body>
</html>
