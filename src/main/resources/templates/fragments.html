<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head (titulo)">
    <meta charset="UTF-8"/>
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<nav th:fragment="menuVisitante" class="navbar navbar-expand navbar-light bg-light" aria-label="Navegación principal">
    <a class="navbar-brand" th:href="@{/about}">ToDoList</a>
    <ul class="navbar-nav ml-auto">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/login}">Login</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/registro}">Registro</a>
        </li>
    </ul>
</nav>

<nav th:fragment="menuUsuario(usuario)" class="navbar navbar-expand navbar-light bg-light" aria-label="Navegación principal">
    <a class="navbar-brand" th:href="@{/about}">ToDoList</a>
    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/usuarios/{id}/tareas(id=${usuario.id})}">Tareas</a>
        </li>
    </ul>
    <ul class="navbar-nav ml-auto">
        <li class="nav-item dropdown">
            <button class="nav-link dropdown-toggle btn btn-link" type="button" id="menuUsuario"
                    data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                    th:text="${usuario.nombre}">Nombre del usuario</button>
            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="menuUsuario">
                <span class="dropdown-item disabled" aria-disabled="true">Cuenta</span>
                <a class="dropdown-item" th:href="@{/logout}"
                   th:text="${'Cerrar sesión ' + usuario.nombre}">Cerrar sesión</a>
            </div>
        </li>
    </ul>
</nav>

<div th:fragment="javascript">
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
</div>

</html>
