<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Error | ToDoList')"></head>

<body>
<nav th:replace="fragments :: menuVisitante"></nav>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm text-center">
                <div class="card-body p-4">
                    <p class="display-4 text-muted mb-3" th:text="${status}">404</p>
                    <h1 class="h3 mb-3" th:switch="${status}">
                        <span th:case="401">No autorizado</span>
                        <span th:case="403">Acceso denegado</span>
                        <span th:case="404">Recurso no encontrado</span>
                        <span th:case="*">No se ha podido completar la solicitud</span>
                    </h1>
                    <p class="text-muted mb-4" th:text="${mensaje}">La página solicitada no existe.</p>
                    <a class="btn btn-primary" th:href="@{/login}">Ir a login</a>
                    <a class="btn btn-outline-secondary" th:href="@{/about}">Acerca de ToDoList</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
